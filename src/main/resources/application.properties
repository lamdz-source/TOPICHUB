spring.application.name=topicmanagement

# Ket noi MariaDB XAMPP - cong 3307
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/student_topic_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Upload bao cao
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.report-dir=${REPORT_UPLOAD_DIR:uploads/reports}

# Cong website
server.address=0.0.0.0
server.port=8080