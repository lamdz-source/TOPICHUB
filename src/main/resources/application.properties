spring.application.name=topicmanagement

# ---- Kết nối MySQL ----
# Mỗi người đổi mật khẩu MySQL của máy mình ở dòng password (đoạn sau dấu :)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_topic_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ---- JPA ----
# none = Spring KHÔNG tự sửa database (database do file SQL quản lý)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- Thymeleaf: tắt cache để sửa HTML là thấy ngay khi đang code ----
spring.thymeleaf.cache=false

# ---- Upload báo cáo sinh viên ----
# Có thể đổi thư mục lưu trên hosting bằng biến môi trường REPORT_UPLOAD_DIR.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.report-dir=${REPORT_UPLOAD_DIR:uploads/reports}
