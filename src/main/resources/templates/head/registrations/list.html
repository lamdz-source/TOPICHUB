<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"><title>Duyệt đăng ký đề tài</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body class="app-page">
<div th:replace="~{fragments/nav :: nav}"></div><div class="box xwide">
    <h2>Duyệt đăng ký đề tài của sinh viên</h2><a th:href="@{/}">&larr; Trang chủ</a>
    <p class="ok" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
    <div class="table-scroll" role="region" tabindex="0" aria-label="Bảng dữ liệu"><table><thead><tr><th>Nhóm</th><th>Đề tài</th><th>Ngày đăng ký</th><th>Thao tác</th></tr></thead>
        <tbody><tr th:each="r : ${registrations}"><td>
                <strong th:text="${r.groupName}"></strong>
                <details><summary>Xem thành viên</summary>
                    <p>Nhóm trưởng: <span th:text="${r.leaderName}"></span></p>
                    <ul><li th:each="member : ${r.members}">
                        <span th:text="${member.fullName}"></span>
                        <span th:if="${member.studentCode != null}" th:text="${'(' + member.studentCode + ')'}"></span>
                    </li></ul>
                </details>
            </td><td>
                <strong th:text="${r.topicTitle}"></strong>
                <details><summary>Xem thông tin đề tài</summary>
                    <p><strong>Mô tả:</strong> <span th:text="${r.topicDescription}"></span></p>
                    <p><strong>Bộ môn:</strong> <span th:text="${r.departmentName}"></span></p>
                    <p><strong>Đợt:</strong> <span th:text="${r.periodName + ' — ' + r.periodType}"></span></p>
                </details>
            </td>
            <td th:text="${r.registeredAt != null ? #temporals.format(r.registeredAt, 'dd/MM/yyyy HH:mm') : ''}"></td><td class="actions">
                <form th:action="@{/head/registrations/{id}/approve(id=${r.id})}" method="post"><button type="submit">Duyệt</button></form>
                <form th:action="@{/head/registrations/{id}/reject(id=${r.id})}" method="post"><input class="reason" name="reason" maxlength="500" placeholder="Lý do từ chối" required><button type="submit">Từ chối</button></form>
            </td></tr><tr th:if="${#lists.isEmpty(registrations)}"><td colspan="4">Không có đăng ký nào đang chờ duyệt.</td></tr></tbody>
    </table></div>
</div></body></html>
