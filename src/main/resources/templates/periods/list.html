<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý đợt đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="box xwide">
    <h2>Quản lý đợt đăng ký</h2>
    <a th:href="@{/}">&larr; Về trang chủ</a>
    <a class="btn" th:href="@{/periods/new}">+ Tạo đợt đăng ký</a>
    <p class="ok" th:if="${message}" th:text="${message}"></p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <table>
        <thead><tr><th>Tên đợt</th><th>Loại</th><th>Giai đoạn GV</th><th>Giai đoạn SV</th><th>Hạn phản biện</th><th>Ngày hội đồng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody>
        <tr th:each="p : ${periods}">
            <td th:text="${p.name}">Đợt đăng ký</td>
            <td th:text="${p.type.displayName}">Khóa luận tốt nghiệp</td>
            <td><span th:text="${#temporals.format(p.lecturerStart, 'dd/MM/yyyy HH:mm')}"></span> – <span th:text="${#temporals.format(p.lecturerEnd, 'dd/MM/yyyy HH:mm')}"></span></td>
            <td><span th:text="${#temporals.format(p.studentStart, 'dd/MM/yyyy HH:mm')}"></span> – <span th:text="${#temporals.format(p.studentEnd, 'dd/MM/yyyy HH:mm')}"></span></td>
            <td th:text="${p.reviewDeadline != null ? #temporals.format(p.reviewDeadline, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td th:text="${p.defenseDate != null ? #temporals.format(p.defenseDate, 'dd/MM/yyyy HH:mm') : '—'}"></td>
            <td th:text="${p.status}">DRAFT</td>
            <td class="actions">
                <a th:if="${p.status.name() == 'DRAFT'}" th:href="@{/periods/{id}/edit(id=${p.id})}">Sửa</a>
                <form th:if="${p.status.name() == 'DRAFT'}" th:action="@{/periods/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('Xóa đợt nháp này? Chỉ xóa được khi chưa có đề tài hoặc hội đồng liên kết.');">
                    <button type="submit">Xóa đợt nháp</button>
                </form>
                <form th:if="${p.status.name() == 'DRAFT'}" th:action="@{/periods/{id}/open(id=${p.id})}" method="post"><button type="submit">Mở đợt</button></form>
                <form th:if="${p.status.name() == 'OPEN'}" th:action="@{/periods/{id}/close(id=${p.id})}" method="post"><button type="submit">Đóng đợt</button></form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(periods)}"><td colspan="8">Chưa có đợt đăng ký nào.</td></tr>
        </tbody>
    </table>
</div>
</body>
</html>
